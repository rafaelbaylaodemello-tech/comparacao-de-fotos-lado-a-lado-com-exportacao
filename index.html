<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparar fotos — CliniDS (light)</title>

<!-- Fontes: Roboto (texto) + Geist Mono (mono) — CliniDS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Ícones utilitários: Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Tokens CliniDS (somente light) -->
<style>
  :root {
    --radius: 0.5rem;
    --font-sans: Roboto, ui-sans-serif, system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --background: #ffffff;
    --foreground: #0c0a09;
    --card: #ffffff;
    --card-foreground: #0c0a09;
    --primary: #ec6726;
    --primary-foreground: #fafaf9;
    --secondary: #fdf0e9;
    --secondary-foreground: #ec6726;
    --muted: #f5f5f4;
    --muted-foreground: #78716c;
    --accent: #f5f5f4;
    --accent-foreground: #1c1917;
    --border: #e7e5e4;
    --input: #e7e5e4;
    --ring: #ec6726;
    /* superfície do palco (área das fotos) */
    --stage: #eceae8;
  }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .font-mono { font-family: var(--font-mono); }
  [data-hidden="true"] { display: none !important; }

  .shadow-cds-xs { box-shadow: 0px 1px 2px 0px #0000000d; }

  /* ---------- Button (shadcn / CliniDS) ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.375rem;
    height:1.875rem; padding:0 .75rem; border-radius:6px; font-size:.8125rem; font-weight:500;
    line-height:1.25rem; white-space:nowrap; cursor:pointer; transition:.15s; }
  .btn:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
  .btn:disabled { opacity:.5; pointer-events:none; }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); }
  .btn-primary:hover { background:#d75e23; }
  .btn-outline { background:var(--card); color:var(--foreground); border:1px solid var(--border); }
  .btn-outline:hover { background:var(--accent); }
  .btn-ghost { background:transparent; color:var(--foreground); }
  .btn-ghost:hover { background:var(--accent); }
  .btn-icon { width:2rem; height:2rem; padding:0; }
  .btn[data-active="true"].btn-outline { background:var(--secondary); border-color:var(--primary); color:var(--secondary-foreground); }

  /* ---------- Tabs (CliniDS2 — node 17375:199556) ---------- */
  /* Track: bg muted #f5f5f4, radius 10, padding 3, itemSpacing 0 */
  .segmented { display:inline-flex; align-items:center; gap:0; padding:3px; background:var(--muted); border-radius:10px; }
  /* Trigger: radius 8, padding 4/8, gap 8, altura 28, Roboto Medium 14/20 */
  .seg { display:inline-flex; align-items:center; gap:8px; height:28px; padding:4px 8px; border-radius:8px;
    font-family:var(--font-sans); font-size:14px; line-height:20px; font-weight:500; color:var(--foreground);
    background:transparent; border:1px solid transparent; cursor:pointer; transition:.15s; }
  .seg i { width:16px; height:16px; }
  /* Ativo (Active=On): pílula branca + sombra sm; texto foreground */
  .seg[data-active="true"] { background:#ffffff; border-color:#ffffff; color:var(--foreground);
    box-shadow:0 1px 3px 0 #0000001a, 0 1px 2px -1px #0000001a; }

  /* ---------- Badge letra A/B ---------- */
  .badge-letter { display:inline-flex; align-items:center; justify-content:center; width:1.375rem; height:1.375rem;
    border-radius:6px; background:var(--primary); color:var(--primary-foreground); font-size:.75rem; font-weight:700; flex:none; }

  .sep-v { width:1px; height:1.25rem; background:var(--border); }

  /* ---------- Layout do viewer ---------- */
  .viewer { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--background); }
  .toolbar { height:56px; flex:none; display:flex; align-items:center; justify-content:space-between;
    gap:1rem; padding:0 1rem; border-bottom:1px solid var(--border); background:var(--card); }
  .stage { flex:1; display:flex; min-height:0; padding:12px; background:var(--muted); }
  .stage.vertical { flex-direction:column; }
  .hints { height:33px; flex:none; display:flex; align-items:center; justify-content:center; gap:1.25rem;
    border-top:1px solid var(--border); background:var(--card); color:var(--muted-foreground);
    font-family:var(--font-sans); font-size:11px; }
  .hint { display:inline-flex; align-items:center; gap:.375rem; font-family:var(--font-sans); }

  /* ---------- Painel ---------- */
  .panel { flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column;
    border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card); }
  .panel-head { height:41px; flex:none; display:flex; align-items:center; gap:.5rem; padding:0 .75rem;
    background:var(--card); border-bottom:1px solid var(--border); }
  .panel-title { font-size:.8125rem; font-weight:500; color:var(--foreground); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel-date { margin-left:auto; font-family:var(--font-sans); font-size:.6875rem; color:var(--muted-foreground); flex:none; }
  .panel-body { flex:1; position:relative; overflow:hidden; display:grid; place-items:center; background:var(--stage); }
  .panel-body img { max-width:100%; max-height:100%; object-fit:contain; transform-origin:center center;
    user-select:none; -webkit-user-drag:none; will-change:transform; }

  /* ---------- Divisória (gap arrastável entre frames) ---------- */
  .divider { flex:none; position:relative; display:flex; align-items:center; justify-content:center; background:transparent; }
  .stage:not(.vertical) .divider { width:12px; cursor:col-resize; }
  .stage.vertical .divider { height:12px; cursor:row-resize; }
  .divider .grip { position:absolute; display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--border); border-radius:9999px; color:var(--muted-foreground); box-shadow:0px 1px 2px 0px #0000000d; }
  .stage:not(.vertical) .divider .grip { width:24px; height:44px; }
  .stage.vertical .divider .grip { width:44px; height:24px; }
</style>

<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans:['Roboto'], mono:['Geist Mono'] } } } };
</script>
</head>

<body>

<div class="viewer" id="viewer">

  <!-- Barra superior -->
  <header class="toolbar">
    <!-- esquerda: título -->
    <div class="min-w-0">
      <div class="text-sm font-semibold leading-5">Comparar fotos</div>
      <div class="text-xs text-muted-foreground leading-4 truncate" id="subtitle">
        WhatsApp-Image-2026-06-17-at-16.21.23-1170x650 × images (2)
      </div>
    </div>

    <!-- direita: ações -->
    <div class="flex items-center gap-2">
      <!-- segmented: modo de exibição -->
      <div class="segmented" role="tablist" aria-label="Modo de exibição">
        <button class="seg" data-layout="side" data-active="true" role="tab">
          <i data-lucide="columns-2" class="w-4 h-4"></i>Lado a lado
        </button>
        <button class="seg" data-layout="stack" role="tab">
          <i data-lucide="rows-2" class="w-4 h-4"></i>Cima e baixo
        </button>
      </div>

      <span class="sep-v"></span>

      <button class="btn btn-outline" id="btnSwap" title="Inverter">
        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>Inverter
      </button>
      <button class="btn btn-outline" id="btnReset" title="Redefinir">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>Redefinir
      </button>
      <button class="btn btn-outline" id="btnSync" title="Zoom sincronizado">
        <i data-lucide="zoom-in" class="w-4 h-4"></i>Zoom sincronizado
      </button>

      <span class="sep-v"></span>

      <button class="btn btn-primary" id="btnExport" title="Exportar">
        <i data-lucide="download" class="w-4 h-4"></i>Exportar
      </button>

      <span class="sep-v"></span>

      <button class="btn btn-icon btn-ghost text-muted-foreground" id="btnClose" aria-label="Fechar comparação" title="Fechar comparação">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Palco: dois painéis + divisória -->
  <div class="stage" id="stage">
    <!-- Painel A -->
    <section class="panel" id="panelA">
      <div class="panel-head">
        <span class="badge-letter">A</span>
        <span class="panel-title" id="titleA">WhatsApp-Image-2026-06-17-at-16.21.23-1170x650</span>
        <span class="panel-date" id="dateA">17/08/2026</span>
      </div>
      <div class="panel-body" data-pane="a"><img id="imgA" alt="Foto A"></div>
    </section>

    <!-- Divisória -->
    <div class="divider" id="divider" role="separator" aria-label="Ajustar divisão" tabindex="0">
      <span class="grip"><i data-lucide="grip-vertical" class="w-3.5 h-3.5" id="gripIcon"></i></span>
    </div>

    <!-- Painel B -->
    <section class="panel" id="panelB">
      <div class="panel-head">
        <span class="badge-letter">B</span>
        <span class="panel-title" id="titleB">images (2)</span>
        <span class="panel-date" id="dateB">17/08/2026</span>
      </div>
      <div class="panel-body" data-pane="b"><img id="imgB" alt="Foto B"></div>
    </section>
  </div>

  <!-- Rodapé de dicas -->
  <footer class="hints">
    <span class="hint">Scroll = zoom</span>
    <span class="hint">Arrastar = mover</span>
    <span class="hint">Arrastar divisória = ajustar</span>
    <span class="hint">Esc = fechar</span>
  </footer>
</div>

<script>
  lucide.createIcons();

  /* ---------- Placeholders (SVG) — sem usar dados reais ---------- */
  function placeholder(letter, label) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='900' height='1200'>
      <rect width='100%' height='100%' fill='#eceae8'/>
      <g fill='#c9c5c1'>
        <rect x='330' y='500' width='240' height='180' rx='16'/>
        <circle cx='400' cy='560' r='26' fill='#eceae8'/>
        <path d='M330 660 l70 -80 60 55 55 -45 55 70 z' fill='#eceae8'/>
      </g>
      <text x='450' y='760' font-family='Roboto, sans-serif' font-size='34' fill='#a8a29e' text-anchor='middle'>Foto ${letter}</text>
      <text x='450' y='806' font-family='Roboto, sans-serif' font-size='24' fill='#c9c5c1' text-anchor='middle'>${label}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const state = {
    a: { src: placeholder('A', 'Antes'), title: 'WhatsApp-Image-2026-06-17-at-16.21.23-1170x650', date: '17/08/2026', scale:1, x:0, y:0 },
    b: { src: placeholder('B', 'Depois'), title: 'images (2)', date: '17/08/2026', scale:1, x:0, y:0 },
    layout: 'side',
    sync: false,
    ratio: 0.5,
  };

  const imgA = document.getElementById('imgA');
  const imgB = document.getElementById('imgB');
  const stage = document.getElementById('stage');
  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');

  function applyPanel(which) {
    const s = state[which];
    (which === 'a' ? imgA : imgB).src = s.src;
    document.getElementById('title' + which.toUpperCase()).textContent = s.title;
    document.getElementById('date' + which.toUpperCase()).textContent = s.date;
    applyTransform(which);
  }
  function applyTransform(which) {
    const s = state[which];
    (which === 'a' ? imgA : imgB).style.transform = `translate(${s.x}px, ${s.y}px) scale(${s.scale})`;
  }
  applyPanel('a'); applyPanel('b');

  /* ---------- Fechar ---------- */
  document.getElementById('btnClose').addEventListener('click', () => {
    document.getElementById('viewer').style.opacity = .4;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('btnClose').click(); });

  /* ---------- Modo de exibição (segmented) ---------- */
  const segs = document.querySelectorAll('.seg');
  segs.forEach(seg => seg.addEventListener('click', () => {
    segs.forEach(s => s.setAttribute('data-active', s === seg ? 'true' : 'false'));
    state.layout = seg.dataset.layout;
    stage.classList.toggle('vertical', state.layout === 'stack');
    document.getElementById('gripIcon').setAttribute('data-lucide', state.layout === 'stack' ? 'grip-horizontal' : 'grip-vertical');
    lucide.createIcons();
    setRatio(state.ratio);
  }));

  /* ---------- Inverter ---------- */
  document.getElementById('btnSwap').addEventListener('click', () => {
    [state.a, state.b] = [state.b, state.a];
    applyPanel('a'); applyPanel('b');
    document.getElementById('subtitle').textContent = `${state.a.title} × ${state.b.title}`;
  });

  /* ---------- Redefinir ---------- */
  document.getElementById('btnReset').addEventListener('click', () => {
    ['a','b'].forEach(w => { state[w].scale = 1; state[w].x = 0; state[w].y = 0; applyTransform(w); });
    setRatio(0.5);
  });

  /* ---------- Zoom sincronizado (toggle) ---------- */
  const btnSync = document.getElementById('btnSync');
  btnSync.addEventListener('click', () => {
    state.sync = !state.sync;
    btnSync.setAttribute('data-active', state.sync ? 'true' : 'false');
  });

  /* ---------- Zoom (scroll) + pan (drag) ---------- */
  function bindPane(el, which) {
    el.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = -e.deltaY * 0.0015;
      zoomBy(which, delta);
    }, { passive:false });
    let dragging = false, lx=0, ly=0;
    el.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; el.setPointerCapture(e.pointerId); el.style.cursor='grabbing'; });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
      panBy(which, dx, dy);
    });
    const end = e => { dragging = false; el.style.cursor='grab'; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.style.cursor = 'grab';
  }
  function zoomBy(which, delta) {
    const targets = state.sync ? ['a','b'] : [which];
    targets.forEach(w => { state[w].scale = Math.min(6, Math.max(0.3, state[w].scale + delta * state[w].scale)); applyTransform(w); });
  }
  function panBy(which, dx, dy) {
    const targets = state.sync ? ['a','b'] : [which];
    targets.forEach(w => { state[w].x += dx; state[w].y += dy; applyTransform(w); });
  }
  bindPane(panelA.querySelector('.panel-body'), 'a');
  bindPane(panelB.querySelector('.panel-body'), 'b');

  /* ---------- Divisória (resize) ---------- */
  const divider = document.getElementById('divider');
  function setRatio(r) {
    state.ratio = Math.min(0.85, Math.max(0.15, r));
    panelA.style.flex = `${state.ratio} 1 0`;
    panelB.style.flex = `${1 - state.ratio} 1 0`;
  }
  setRatio(0.5);
  let resizing = false;
  divider.addEventListener('pointerdown', e => { resizing = true; divider.setPointerCapture(e.pointerId); e.preventDefault(); });
  divider.addEventListener('pointermove', e => {
    if (!resizing) return;
    const r = stage.getBoundingClientRect();
    const ratio = state.layout === 'stack' ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    setRatio(ratio);
  });
  const stopResize = () => resizing = false;
  divider.addEventListener('pointerup', stopResize);
  divider.addEventListener('pointercancel', stopResize);

  /* ---------- Drop de fotos reais (para teste; não altera o layout) ---------- */
  function bindDrop(el, which) {
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (!f || !f.type.startsWith('image/')) return;
      state[which].src = URL.createObjectURL(f);
      state[which].title = f.name;
      applyPanel(which);
      document.getElementById('subtitle').textContent = `${state.a.title} × ${state.b.title}`;
    });
  }
  bindDrop(panelA.querySelector('.panel-body'), 'a');
  bindDrop(panelB.querySelector('.panel-body'), 'b');

  /* ---------- Exportar (composição em canvas) ---------- */
  document.getElementById('btnExport').addEventListener('click', () => {
    const side = state.layout === 'side';
    const cellW = 1000, cellH = 1000, gap = 24, pad = 32, headH = 44;
    const A = imgA, B = imgB;
    const W = side ? pad*2 + cellW*2 + gap : pad*2 + cellW;
    const H = side ? pad*2 + headH + cellH : pad*2 + (headH + cellH)*2 + gap;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    ctx.imageSmoothingQuality = 'high';

    function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    function drawContain(img,x,y,w,h){ const ir=img.naturalWidth/img.naturalHeight, dr=w/h; let dw,dh; if(ir>dr){dw=w;dh=w/ir;}else{dh=h;dw=h*ir;} ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); }
    function drawCell(img, letter, title, x, y){
      // header
      ctx.fillStyle = '#0c0a09'; ctx.font = '700 26px Roboto, sans-serif'; ctx.textBaseline='middle';
      ctx.fillStyle = '#ec6726'; roundRect(x, y, 32, 32, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign='center'; ctx.fillText(letter, x+16, y+17); ctx.textAlign='left';
      ctx.fillStyle = '#0c0a09'; ctx.font = '500 22px Roboto, sans-serif'; ctx.fillText(title, x+44, y+17);
      // image
      const iy = y + headH;
      ctx.fillStyle = '#eceae8'; roundRect(x, iy, cellW, cellH, 12); ctx.fill();
      ctx.save(); roundRect(x, iy, cellW, cellH, 12); ctx.clip(); drawContain(img, x, iy, cellW, cellH); ctx.restore();
      ctx.strokeStyle = '#e7e5e4'; ctx.lineWidth = 2; roundRect(x, iy, cellW, cellH, 12); ctx.stroke();
    }
    if (side) {
      drawCell(A, 'A', state.a.title, pad, pad);
      drawCell(B, 'B', state.b.title, pad + cellW + gap, pad);
    } else {
      drawCell(A, 'A', state.a.title, pad, pad);
      drawCell(B, 'B', state.b.title, pad, pad + headH + cellH + gap);
    }
    c.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `comparacao-${new Date().toISOString().slice(0,10)}.png`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });
</script>
</body>
</html>
